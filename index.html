<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paula Domingues | App</title>

    <!--
      PWA "instalável" (21/08/2026, ícone atualizado em 20/08/2026) — deixa
      o site oferecer o botão "Instalar aplicativo" no Chrome/Android (e
      "Adicionar à Tela de Início" no Safari/iOS), com ícone e nome
      próprios, igual concorrentes tipo o "Querido Diário". Os arquivos em
      /icons/ e o favicon.svg usam o ícone (lábios + ondas de som) que a
      Amanda desenhou no Figma (node 1208:6675) — a cor de fundo do ícone
      (#A32F34) é ligeiramente diferente do vermelho da marca do site
      (#931717); usamos a cor real do ícone no theme-color pra não destoar.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#A32F34" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Paula Domingues" />

    <!-- Fontes usadas no design do Figma -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;500;700&family=Sofia+Sans+Extra+Condensed:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
