<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paula Domingues | App</title>

    <!--
      PWA "instalável" (21/08/2026) — deixa o site oferecer o botão
      "Instalar aplicativo" no Chrome/Android (e "Adicionar à Tela de
      Início" no Safari/iOS), com ícone e nome próprios, igual concorrentes
      tipo o "Querido Diário".

      05/09/2026 (Amanda, Figma node 1360:9488): ícone trocado pro novo —
      um "C" em arco preto com uma seta/gráfico em zigue-zague vermelho por
      dentro (fundo branco). Os arquivos em /icons/, /favicon.ico e
      /favicon.png vêm todos de um único PNG 1024×1024 exportado do Figma
      (o ambiente aqui não baixa assets direto do figma.com, então a Amanda
      exportou e mandou o arquivo, e as versões menores foram geradas a
      partir dele). O favicon.svg antigo (ícone antigo de lábios + ondas de
      som) saiu — sem uma versão vetorial do ícone novo, o favicon virou
      .ico + .png; troca por um SVG de verdade se um dia a Amanda exportar
      um.
      O vermelho da seta bate exatamente com o token `main-red-500`
      (#D91A20) já usado na paleta do app — por isso o theme-color abaixo
      usa esse tom (branco, o fundo do próprio ícone, ficaria sem graça na
      barra de status/endereço).
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#D91A20" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Paula Domingues" />

    <!-- Fontes usadas no design do Figma -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@400;500;700&family=Sofia+Sans+Extra+Condensed:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
